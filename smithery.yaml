# Smithery.ai configuration for WinScript MCP Server
# This file tells Smithery how to build and deploy your MCP server

name: winscript
description: |
  AppleScript for Windows — MCP server for AI agents.
  Control any Windows app from Claude, ChatGPT, or any MCP client.
  
  59 tools for: app control, UI automation, Excel/Outlook COM automation,
  file management, screenshots, clipboard, workflow recording/replay,
  semantic intents, and full audit logging.

version: 0.1.0

author:
  name: Roshan Ravani
  email: roshan@example.com

repository: https://github.com/roshandamm/winscript-mcp

license: MIT

# Server configuration
server:
  # Command to start the MCP server
  command: python
  args: ["-m", "winscript.server"]
  
  # Environment variables (if needed)
  env:
    PYTHONUNBUFFERED: "1"
  
  # Port for MCP communication (default for stdio transport)
  transport: stdio

# Build configuration
build:
  # Docker-based deployment
  dockerfile: Dockerfile
  
  # Python dependencies
  dependencies:
    - fastmcp
    - pywinauto
    - pywin32
    - uiautomation
    - mss
    - Pillow
    - pytesseract
    - pyautogui

# Platform support
platforms:
  - windows-10
  - windows-11

# Required system dependencies
system_requirements:
  - python-3.10+
  - windows-10-or-11
  - optional: tesseract-ocr (for OCR fallback)

# MCP capabilities provided to clients
capabilities:
  tools:
    count: 59
    categories:
      - name: "App Control"
        tools: ["open_app", "close_app", "focus_app", "get_running_apps", "wait_for_window"]
      - name: "UI Interaction"
        tools: ["click", "type_text", "read_text", "press_key", "get_ui_tree", "coordinate_click"]
      - name: "COM Office"
        tools: ["excel_read_cell", "excel_write_cell", "excel_read_range", "outlook_send_email", "outlook_read_inbox"]
      - name: "File System"
        tools: ["read_file_text", "write_file_text", "list_dir", "move_file", "copy_file", "delete_file", "file_exists"]
      - name: "Screen + Clipboard"
        tools: ["take_screenshot", "get_active_window", "get_clipboard", "set_clipboard"]
      - name: "PowerShell"
        tools: ["run_powershell"]
      - name: "Excel Adapter"
        tools: ["excel_open", "excel_save", "excel_close"]
      - name: "Chrome Adapter"
        tools: ["chrome_open", "chrome_navigate", "chrome_get_url", "chrome_get_title", "chrome_new_tab", "chrome_close_tab", "chrome_find_on_page"]
      - name: "Explorer Adapter"
        tools: ["explorer_open", "explorer_navigate"]
      - name: "Notepad Adapter"
        tools: ["notepad_open", "notepad_type", "notepad_save", "notepad_close"]
      - name: "Outlook Adapter"
        tools: ["outlook_open"]
      - name: "Workflow Recorder + Replay"
        tools: ["workflow_record_start", "workflow_record_stop", "workflow_record_discard", "workflow_replay", "workflow_list", "workflow_delete"]
      - name: "Semantic Intents"
        tools: ["open_latest_file", "send_email_with_content", "find_in_folder", "read_active_document", "summarize_screen"]
      - name: "Audit + Memory + State"
        tools: ["get_audit_log", "get_failure_report", "what_windows_have_i_seen", "what_files_have_i_opened", "what_did_i_do"]
      - name: "Execution Modes"
        tools: ["set_execution_mode", "get_execution_mode"]

# Installation methods
installation:
  - name: "Smithery Cloud Hosted"
    description: "Run on Smithery's infrastructure - no local setup needed"
    type: cloud
  - name: "Docker Local"
    description: "Run locally with Docker - one command deployment"
    type: docker
    command: "docker run -v %USERPROFILE%/.winscript:~/.winscript winscript:latest"
  - name: "PyPI Install"
    description: "Install via pip and run directly"
    type: pip
    command: "pip install winscript && winscript"
  - name: "Direct Download"
    description: "Download and run without installation"
    type: direct
    command: "python winscript-server.py"

# Tags for discoverability
tags:
  - windows
  - automation
  - mcp
  - ai-agents
  - applescript
  - desktop-control
  - ui-automation
  - com-automation
  - excel
  - outlook
  - workflow-automation
  - state-aware

# Example use cases
use_cases:
  - "Automate Excel reports and email them"
  - "Fill out forms in legacy Windows applications"
  - "Read and organize files based on AI instructions"
  - "Control any Windows app from natural language"
  - "Record and replay complex multi-step workflows"
  - "Take screenshots and analyze UI state"
  - "Send emails with dynamically generated content"
