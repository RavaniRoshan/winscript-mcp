[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winscript"
version = "0.1.0"
description = "AppleScript for Windows — MCP server for AI agents. Control any Windows app from Claude, ChatGPT, or any MCP client."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Roshan Ravani", email = "roshan@example.com"}
]
keywords = [
    "mcp",
    "windows",
    "automation",
    "ai-agents",
    "applescript",
    "uiautomation",
    "com",
    "pywinauto",
    "desktop-automation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
    "pywinauto",
    "pywin32",
    "uiautomation",
    "mss",
    "Pillow",
    "pytesseract",
    "pyautogui",
]

[project.urls]
Homepage = "https://github.com/roshandamm/winscript-mcp"
Documentation = "https://github.com/roshandamm/winscript-mcp#readme"
Repository = "https://github.com/roshandamm/winscript-mcp"
Issues = "https://github.com/roshandamm/winscript-mcp/issues"

[project.scripts]
winscript = "winscript.server:main"
winscript-server = "winscript.server:main"

[tool.setuptools.packages.find]
include = ["winscript*"]
exclude = ["tests*", "examples*", "venv*"]

[tool.setuptools.package-data]
winscript = ["*.md", "*.txt"]
